      - name: Configure RDP Administrator Account
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing. Configure it in GitHub repository secrets."
          }

          if ($env:RDP_PASSWORD.Length -lt 12) {
              throw "RDP_PASSWORD must contain at least 12 characters."
          }

          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          Write-Host "Configuring RDP account..."

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name $username -Password $password
              Enable-LocalUser -Name $username
              Write-Host "Existing RDP account password updated."
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $password `
                -FullName "PCYBER RDP Administrator" `
                -Description "Remote Desktop Administrator Account" `
                -PasswordNeverExpires `
                -AccountNeverExpires

              Write-Host "New RDP account created."
          }

          $user = Get-LocalUser -Name $username
          $sid = $user.SID.Value

          # Administrator group
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"

          $adminMember = Get-LocalGroupMember -Group $adminGroup.Name -ErrorAction SilentlyContinue |
              Where-Object { $_.SID.Value -eq $sid }

          if (-not $adminMember) {
              Add-LocalGroupMember -Group $adminGroup.Name -Member $username
          }

          # Remote Desktop Users group
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          $rdpMember = Get-LocalGroupMember -Group $rdpGroup.Name -ErrorAction SilentlyContinue |
              Where-Object { $_.SID.Value -eq $sid }

          if (-not $rdpMember) {
              Add-LocalGroupMember -Group $rdpGroup.Name -Member $username
          }

          # Configure profile path
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"

          New-Item -Path $profileKey -Force | Out-Null

          Set-ItemProperty `
            -Path $profileKey `
            -Name "ProfileImagePath" `
            -Value $env:RDP_PROFILE `
            -Force

          # Create directories
          @(
              $env:RDP_PROFILE,
              $env:RDP_DESKTOP,
              $env:RDP_DOWNLOADS,
              $env:PCYBER_DIR
          ) | ForEach-Object {
              New-Item -ItemType Directory -Path $_ -Force | Out-Null
          }

          # Grant permissions
          icacls $env:RDP_PROFILE /grant "*${sid}:(OI)(CI)F" /T /C | Out-Null
          icacls $env:PCYBER_DIR /grant "*${sid}:(OI)(CI)F" /T /C | Out-Null

          Write-Host "========================================"
          Write-Host "RDP ACCOUNT CONFIGURED"
          Write-Host "Username: $username"
          Write-Host "Administrator: Enabled"
          Write-Host "Remote Desktop: Enabled"
          Write-Host "Desktop: $env:RDP_DESKTOP"
          Write-Host "========================================"
